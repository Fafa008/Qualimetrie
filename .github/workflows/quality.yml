name: Quality Gate & SonarCloud

on:
  push:
    branches: [ main, develop, 'dev-*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, sqlite, pdo_sqlite
          coverage: xdebug

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run PHPStan Analysis
        run: vendor/bin/phpstan analyse app --level=max --no-progress

      - name: Run Laravel Pint (Format Check)
        run: vendor/bin/pint --test || true

      - name: Run PHPUnit Tests with Coverage
        run: vendor/bin/phpunit --coverage-clover=build/logs/clover.xml --log-junit=build/logs/junit.xml

      - name: Fix coverage paths for SonarCloud
        run: |
          sed -i 's|'$GITHUB_WORKSPACE'||g' build/logs/clover.xml

      - name: Upload coverage reports to SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Quality Gate Status Check
        run: echo "Quality Gate check sent to SonarCloud"
